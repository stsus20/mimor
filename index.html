<!DOCTYPE html>
<html lang="es" data-motion="on">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Nuestra galaxia de amor interactiva.">
  <meta name="theme-color" content="#050411">
  <title>Nuestra Galaxia de Amor</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 29'%3E%3Cpath fill='%23d98a9e' d='M16 29S1 19.5 1 9.5C1 4.25 5.25 0 10.5 0 13.1 0 15.3 1.2 16 3.05 16.7 1.2 18.9 0 21.5 0 26.75 0 31 4.25 31 9.5 31 19.5 16 29 16 29Z'/%3E%3C/svg%3E">
  
  <!-- Three.js para la galaxia 3D interactiva -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- ===================== FONDO: GALAXIA MEJORADA ===================== -->
  <canvas id="galaxy" aria-hidden="true"></canvas>

  <div class="nebula nebula--violet" aria-hidden="true"></div>
  <div class="nebula nebula--rose" aria-hidden="true"></div>
  <div class="nebula nebula--blue" aria-hidden="true"></div>
  <div class="nebula nebula--cyan" aria-hidden="true"></div>
  <div class="galaxy-band" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- ===================== CONTROL DE MOVIMIENTO ===================== -->
  <button id="motionToggle" class="motion-toggle" type="button"
          data-paused="false" aria-label="Pausar estrellas">
    <span class="motion-toggle__icon" aria-hidden="true">✦</span>
    <span class="motion-toggle__label">Pausar estrellas</span>
  </button>

  <!-- ===================== INTERFAZ PRINCIPAL ===================== -->
  <main class="galaxy-interface">
    
    <!-- Reloj Contador -->
    <header class="top-bar">
      <div class="story-counter" role="group" aria-labelledby="counterLabel">
        <span class="story-counter__label" id="counterLabel">Tiempo juntos</span>

        <div class="story-counter__units" role="timer">
          <span class="story-counter__unit">
            <span class="story-counter__value" id="countMonths">00</span>
            <span class="story-counter__unit-label">meses</span>
          </span>
          <span class="story-counter__unit">
            <span class="story-counter__value" id="countDays">00</span>
            <span class="story-counter__unit-label">días</span>
          </span>
          <span class="story-counter__unit">
            <span class="story-counter__value" id="countHours">00</span>
            <span class="story-counter__unit-label">horas</span>
          </span>
          <span class="story-counter__unit">
            <span class="story-counter__value" id="countMinutes">00</span>
            <span class="story-counter__unit-label">minutos</span>
          </span>
          <span class="story-counter__unit">
            <span class="story-counter__value" id="countSeconds">00</span>
            <span class="story-counter__unit-label">segundos</span>
          </span>
        </div>
      </div>
    </header>

    <div class="instructions-hint">
      <span>Mi amor por ti, no cabe en este luagr.</span>
    </div>

    <!-- Contenedor del Universo 3D -->
    <div id="canvas-container"></div>

    <!-- Modal emergente para las frases de los planetas / Sol -->
    <div id="planet-card" class="planet-card hidden">
      <h3 id="card-title">Planeta</h3>
      <p id="card-message">Mensaje para mi novia...</p>
      <button id="card-close" class="btn-glass">Volver a la Galaxia</button>
    </div>

  </main>

  <!-- Capa del Easter Egg de Explosión Épica -->
  <div id="easter-egg-overlay" class="easter-egg-overlay hidden">
    <div class="explosion-flash"></div>
    <div class="shockwave"></div>
    <div class="easter-egg-text">
      <h2>Yo te amo en todos los universos</h2>
    </div>
  </div>

  <!-- Corazones interactivos -->
  <div id="heartsLayer" class="hearts-layer" aria-hidden="true"></div>

  <script src="js/script.js"></script>
</body>
</html>
